# Start here: change these three values for your site.
title: My journal
description: Stories, places and everyday discoveries
subtitle: A personal journal
author:
  name: Your name

# Replace dieghernan and chulapa-101 with your GitHub username and repository.
# The Pages workflow supplies the deployment base path.
repository: dieghernan/chulapa-101
url: https://dieghernan.github.io
baseurl: ""
locale: en-US

# Choose a predefined skin. No CSS customization is needed.
# More skins: https://dieghernan.github.io/chulapa/skins
chulapa-skin:
  skin: gitdev

navbar:
  brand:
    title: Home
  nav:
    - title: About
      url: /about/
footer:
  links:
    - label: RSS
      icon: fa fa-rss
      url: /atom.xml
search:
  provider: fusejs
  landing_page: /search.html
  show_attrib: false

# You can leave the settings below as they are.
remote_theme: dieghernan/chulapa
plugins:
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-remote-theme
permalink: /blog/:year/:month/:day/:title/
defaults:
  - scope:
      path: ""
    values:
      layout: default
      header_type: base
      include_on_search: false
  - scope:
      path: _pages
    values:
      include_on_search: true
  - scope:
      path: ""
      type: posts
    values:
      header_type: post
      include_on_search: true
      include_on_feed: true
      show_date: true
      show_author: true

include:
  - _pages
exclude:
  - AGENTS.md
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.Rproj"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions, abs-percent, function-units]
